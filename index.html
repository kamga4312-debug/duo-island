<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="규롱섬">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFCF6">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>듀오 아일랜드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width app column — island stage on top, scrolling content, tab bar fixed at the bottom. */
:root{
  --sea:#1F6F86;
  --lagoon:#A6E1D8;
  --sand:#F6EEDD;
  --paper:#FFFCF6;
  --ink:#203038;
  --muted:#6A7A80;
  --hibiscus:#DD4F75;
  --leaf:#3F8F5A;
  --sun:#F2B544;
  --line:#E8DFCC;
  --postit:#FFE89A;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hand:"Gaegu","Gowun Dodum",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--paper);box-shadow:0 0 0 1px var(--line)}
header.top{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
header.top h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dday{font-family:var(--display);font-size:15px;color:var(--hibiscus);background:#FCE6EC;border-radius:999px;padding:3px 10px;white-space:nowrap}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--sand)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 28px}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--paper)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 11px;text-decoration:none;color:var(--muted);font-size:12px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--sea)}
nav.tabs a[aria-current="page"] span{font-weight:700}
.banner{background:#E4F4F1;color:var(--sea);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.banner.warn{background:#FFF1D6;color:#8A5A00}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3,.sec-title{font-family:var(--display);font-weight:400;font-size:17px;margin:0 0 8px}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec-title small{font-family:var(--body);font-size:12px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--sea);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--hibiscus)}
.btn.ghost{background:var(--sand);color:var(--ink)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.who.a{background:var(--sea)} .who.b{background:var(--hibiscus)}
.link{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px;text-decoration:underline}
.link.danger{color:#B23A48}

/* island */
.stage{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#D6F0EE}
.stage canvas{display:block;width:100%;height:250px}
.lvbox{position:absolute;left:12px;top:12px;background:rgba(255,252,246,.92);border-radius:14px;padding:8px 12px;min-width:150px}
.lvbox b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--sea)}
.lvbox .bar{height:6px;border-radius:6px;background:var(--line);margin-top:5px;overflow:hidden}
.lvbox .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--sun))}
.lvbox .muted{font-size:11px}
.gift{display:flex;gap:14px;align-items:center;background:#FFF5E1;border:1px dashed var(--sun);border-radius:16px;padding:14px;width:100%;text-align:left}
.gift .box{width:52px;height:52px;flex:none}
.gift b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.gift.opening .box{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(1)}}
.note{font-family:var(--hand);font-size:19px;line-height:1.35;background:var(--postit);padding:10px 12px 12px;border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.06);transform:rotate(var(--r,-1deg));position:relative}
.note .meta{font-family:var(--body);font-size:11px;color:#7A6A2A;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.note.pink{background:#FFD9E2}
.note.mint{background:#D3F1EA}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:rgba(0,0,0,.07)}
.unlock{display:flex;gap:10px;align-items:center;font-size:13px}
.unlock{gap:12px}
.unlock .dot{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--sand);flex:none;position:relative}
.unlock .dot svg{width:38px;height:38px;filter:grayscale(1);opacity:.4}
.unlock.done .dot{background:#E3F4EC}
.unlock.done .dot svg{filter:none;opacity:1}
.unlock .ok{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--leaf);color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;border:2px solid #fff}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal .wd:first-child{color:var(--hibiscus)}
.day{border:0;background:#fff;border-radius:10px;min-height:58px;padding:4px 3px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
.day.out{opacity:.35}
.day .n{font-size:12px;font-variant-numeric:tabular-nums;line-height:18px;width:20px;height:20px;border-radius:50%}
.day.today .n{background:var(--ink);color:#fff}
.day.sel{box-shadow:inset 0 0 0 2px var(--sea);background:#F1FAF8}
.day .ev{width:88%;height:4px;border-radius:3px}
.day .ev.a{background:var(--sea)} .day .ev.b{background:var(--hibiscus)}
.day .marks{display:flex;gap:2px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:auto}
.mk{width:6px;height:6px;border-radius:50%}
.mk.a{background:var(--sea)} .mk.b{background:var(--hibiscus)}
.mk.photo{border-radius:1px;background:var(--sun)}
.mk.heart{width:auto;height:auto;background:none;color:var(--hibiscus);font-size:9px;line-height:1}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead h3{margin:0}
.polas{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:6px 2px}
.pola{background:#fff;padding:8px 8px 10px;box-shadow:0 3px 10px rgba(32,48,56,.14);transform:rotate(var(--r,0deg));border-radius:2px}
.pola .ph{aspect-ratio:1;background:var(--sand);overflow:hidden}
.pola img{width:100%;height:100%;object-fit:cover;display:block}
.pola p{font-family:var(--hand);font-size:17px;margin:6px 2px 0;line-height:1.25}
.line{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line p{margin:0;flex:1}
.evcard{border-radius:14px;border:1px solid var(--line);padding:10px 12px;border-left:6px solid var(--sea);background:#fff}
.evcard.b{border-left-color:var(--hibiscus)}
.evcard .t{font-weight:700}
.evnotes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.evnotes .note{font-size:17px;max-width:100%}

/* tasty */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sand);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-family:var(--display);font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.place{display:flex;gap:12px;align-items:flex-start}
.place .cat{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-size:13px;flex:none;color:var(--ink)}
.place .body{flex:1;min-width:0}
.place .name{font-weight:700;font-size:16px}
.stars{color:var(--sun);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.review{font-family:var(--hand);font-size:18px;line-height:1.3;margin:2px 0}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:12px;color:var(--muted)}
.stamp.on{border:2px solid var(--hibiscus);color:var(--hibiscus);background:#FFF0F4;transform:rotate(-8deg)}
.roulette-btn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:16px;padding:16px;background:var(--ink);color:#fff;text-align:left}
.roulette-btn b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.fab{position:sticky;bottom:6px;margin-left:auto;display:flex;justify-content:flex-end;pointer-events:none}
.fab .btn{pointer-events:auto;box-shadow:0 6px 16px rgba(31,111,134,.3);border-radius:999px;padding:12px 18px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,32,38,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px 22px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--sea);background:#E8F6F3;color:var(--sea);font-weight:700}
.starin button{border:0;background:none;font-size:30px;line-height:1;color:var(--line);padding:0 2px}
.starin button.on{color:var(--sun)}
.preview{max-width:140px;border-radius:10px;display:block;margin-top:6px}
.sheet .acts{display:flex;gap:8px;margin-top:6px}
.sheet .acts .btn{flex:1}
.wheel{height:120px;border-radius:18px;background:var(--sand);display:grid;place-items:center;text-align:center;padding:10px;margin-bottom:14px;overflow:hidden}
.wheel b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2}
.wheel.done{background:#FFF0F4}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 8px}
.onboard h2{font-family:var(--display);font-weight:400;font-size:24px;margin:4px 0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="isleName">듀오 아일랜드</h1>
    <span class="dday" id="dday" hidden></span>
    <button class="iconbtn" id="settingsBtn" aria-label="섬 설정" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <a href="#island" data-tab="island"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 19c2 0 2-1.5 4-1.5S8 19 10 19s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M12 16V8"/><path d="M12 8c-1.5-2.5-4.5-3-6.5-2M12 8c1.5-2.5 4.5-3 6.5-2M12 8c-2 0-4 1.5-4.5 3.5M12 8c2 0 4 1.5 4.5 3.5"/></svg><span>아일랜드</span></a>
    <a href="#calendar" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>캘린더</span></a>
    <a href="#tasty" data-tab="tasty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 1-3 4-3 7h3v11"/></svg><span>테이스티</span></a>
  </nav>
</div>
<div id="layer"></div>

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dotDate = s => s ? s.replaceAll('-', '.') : '';
const WD = ['일','월','화','수','목','금','토'];
const CATS = ['한식','일식','중식','양식','카페','기타'];
const CAT_COLOR = {'한식':'#FBE3C8','일식':'#E2EEF9','중식':'#FCD9D3','양식':'#E7F1D8','카페':'#EFE3D6','기타':'#ECE8F3'};
const LEVELS = [0, 30, 80, 150, 250, 380, 550, 770, 1050, 1400];
const MAX_TEXT = 140;
const DOG_MS = 3 * 864e5;
const ICONS = {
  luna: `<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="9" cy="19" rx="5" ry="9" fill="#B97E37" transform="rotate(18 9 19)"/><ellipse cx="31" cy="19" rx="5" ry="9" fill="#B97E37" transform="rotate(-18 31 19)"/><circle cx="20" cy="19" r="12" fill="#DDA45A"/><ellipse cx="20" cy="25" rx="7" ry="5" fill="#F0C98E"/><circle cx="15.5" cy="17" r="1.6" fill="#2B2420"/><circle cx="24.5" cy="17" r="1.6" fill="#2B2420"/><ellipse cx="20" cy="22.5" rx="2.3" ry="1.7" fill="#2B2420"/><path d="M18 27 q2 2 4 0" stroke="#2B2420" stroke-width="1.1" fill="none" stroke-linecap="round"/><path d="M19 28 q1 4 2 0" fill="#E2557A"/></svg>`,
  sin: `<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="9" cy="22" rx="5.5" ry="9" fill="#F1EEE7" stroke="#DCD7CC"/><ellipse cx="31" cy="22" rx="5.5" ry="9" fill="#F1EEE7" stroke="#DCD7CC"/><circle cx="20" cy="20" r="11.5" fill="#FBFAF6" stroke="#DCD7CC"/><circle cx="13" cy="11" r="4" fill="#FBFAF6"/><circle cx="20" cy="9" r="4.5" fill="#FBFAF6"/><circle cx="27" cy="11" r="4" fill="#FBFAF6"/><circle cx="15.5" cy="19" r="1.8" fill="#2B2420"/><circle cx="24.5" cy="19" r="1.8" fill="#2B2420"/><ellipse cx="20" cy="24" rx="2" ry="1.5" fill="#2B2420"/><path d="M20 8 l-5 -3 v6 z M20 8 l5 -3 v6 z" fill="#FF8FAB"/><circle cx="20" cy="8" r="1.6" fill="#E2557A"/></svg>`,
  hut: `<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="33" rx="15" ry="3" fill="#5FA86B"/><rect x="10" y="19" width="20" height="14" fill="#C99A63"/><path d="M6 20 L20 7 L34 20 Z" fill="#9C6B3A"/><rect x="17" y="24" width="6" height="9" fill="#5A3C22"/><rect x="24" y="22" width="4" height="4" fill="#FFE07A"/></svg>`,
  flag: `<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="16" cy="34" rx="10" ry="2.5" fill="#5FA86B"/><rect x="14" y="5" width="2.5" height="29" fill="#5A3C22"/><path d="M16.5 6 Q26 8 34 11 L16.5 19 Z" fill="#DD4F75"/><path d="M22 10.5 l1 2.2 2.4.2 -1.8 1.6 .6 2.3 -2.2-1.3 -2.2 1.3 .6-2.3 -1.8-1.6 2.4-.2z" fill="#fff"/></svg>`,
  boat: `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 33 q4-2 8 0 t8 0 t8 0 t8 0" stroke="#7CCCC6" stroke-width="2" fill="none"/><path d="M7 26 H33 L28 32 H12 Z" fill="#8B5A3C"/><rect x="19" y="6" width="2" height="20" fill="#5A3C22"/><path d="M21 7 L31 24 H21 Z" fill="#FFFCF6" stroke="#DCD7CC"/><path d="M19 10 L11 24 H19 Z" fill="#F2B544"/></svg>`,
  market: `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="8" y="14" width="2.5" height="20" fill="#8B6A43"/><rect x="29.5" y="14" width="2.5" height="20" fill="#8B6A43"/><rect x="7" y="25" width="26" height="8" fill="#C99A63"/><path d="M5 10 H35 V16 H5 Z" fill="#DD4F75"/><path d="M11 10 h6 v6 h-6z M23 10 h6 v6 h-6z" fill="#FFFCF6"/><path d="M5 5 Q20 11 35 5" stroke="#5A3C22" fill="none"/><circle cx="11" cy="7" r="2" fill="#F2B544"/><circle cx="20" cy="8.5" r="2" fill="#F2B544"/><circle cx="29" cy="7" r="2" fill="#F2B544"/></svg>`
};
const rot = i => ((i * 37) % 7 - 3) * 0.7;

/* ---------- state ---------- */
const now0 = new Date();
const S = {

/* ---------- island stats ---------- */
function stats() {
  const byDate = {};
  S.records.forEach(r => (byDate[r.date] ||= new Set()).add(r.author));
  const active = Object.keys(byDate).length;
  const both = Object.values(byDate).filter(s => s.size >= 2).length;
  const praiseN = S.praises.length;
  const visited = S.places.filter(p => p.status === 'visited').length;
  const xp = active * 10 + both * 15 + praiseN * 5 + visited * 8;
  let lv = 1;
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i]) lv = i + 1;
  const cur = LEVELS[lv - 1], next = LEVELS[lv] ?? null;
  const pct = next ? Math.round((xp - cur) / (next - cur) * 100) : 100;
  const last = {};
  S.praises.forEach(p => { if (revealed(p)) last[p.from] = Math.max(last[p.from] || 0, p.revealAt || p.createdAt || 0); });
  const [m0, m1] = members();
  const retriever = !!m0 && Date.now() - (last[m0] || 0) < DOG_MS;
  const maltese = !!m1 && Date.now() - (last[m1] || 0) < DOG_MS;
  return { active, both, praiseN, visited, xp, lv, next, pct, retriever, maltese };
}

function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let max = 900, q = 0.8, out = '';
      for (let i = 0; i < 7; i++) {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 200000) break;
        max *= 0.8; q = Math.max(0.5, q - 0.07);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했어요.')); };
    img.src = url;
  });
}

  if (!S.couple || !isMember()) { m.innerHTML = `<div class="card stack"><h3>섬을 찾을 수 없어요</h3><p class="muted" style="margin:0">다시 로그인해 주세요.</p><button class="btn block" data-act="logout">로그아웃</button></div>`; return; }
  const body = S.tab === 'calendar' ? calendarHtml() : S.tab === 'tasty' ? tastyHtml() : islandHtml();
  m.innerHTML = banners() + body;
  if (S.tab === 'island') startIsland();
  loadPhotos(m);
}

function setupHtml() {
  const join = S.setupMode === 'join';

const genCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; const r = crypto.getRandomValues(new Uint32Array(6)); r.forEach(v => c += A[v % A.length]); return c; };
async function makeInvite(iid) {
  let code = genCode();
  for (let i = 0; i < 5; i++) { const ex = await F.getDoc(F.doc(db, 'invites', code)); if (!ex.exists()) break; code = genCode(); }
  await F.setDoc(F.doc(db, 'invites', code), { islandId: iid, createdBy: S.me, createdAt: Date.now() });
  await F.updateDoc(F.doc(db, 'islands', iid), { inviteCode: code });
  return code;
}
function wireSetup() {
  const go = $('#st-go'); if (!go) return;
  go.addEventListener('click', async () => {
    const n = $('#st-nick').value.trim();
    if (!n) return toast('닉네임을 입력해 주세요.');
    go.disabled = true;
    try {
      if (S.setupMode === 'join') {
        const code = $('#st-code').value.trim().toUpperCase();
        if (code.length !== 6) { toast('초대 코드 6자리를 입력해 주세요.'); go.disabled = false; return; }
        const inv = await F.getDoc(F.doc(db, 'invites', code));
        if (!inv.exists()) { toast('초대 코드를 다시 확인해 주세요.'); go.disabled = false; return; }
        const iid = inv.data().islandId;
        let is;
        try { is = await F.getDoc(F.doc(db, 'islands', iid)); } catch (er) { toast('이미 두 사람이 입주한 섬이에요.'); go.disabled = false; return; }
        const d = is.data();
        if (!d.members.includes(S.me)) {
          if (d.members.length >= 2) { toast('이미 두 사람이 입주한 섬이에요.'); go.disabled = false; return; }
          await F.updateDoc(is.ref, { members: [...d.members, S.me], [`nick.${S.me}`]: n });
        }
        await F.setDoc(F.doc(db, 'users', S.me), { islandId: iid });
        toast('입주를 환영해요!'); enterIsland(iid);
      } else {
        const ref = F.doc(F.collection(db, 'islands'));
        await F.setDoc(ref, { name: $('#st-name').value.trim() || '우리 둘의 섬', since: $('#st-since').value || todayStr(), members: [S.me], nick: { [S.me]: n }, createdAt: Date.now() });
        await makeInvite(ref.id);
        await F.setDoc(F.doc(db, 'users', S.me), { islandId: ref.id });
        toast('섬이 생겼어요!'); enterIsland(ref.id);
      }
    } catch (er) { toast(errMsg(er)); go.disabled = false; }
  });
}

/* ---------- calendar tab ---------- */
function calendarHtml() {
  const { y, m } = S.cal; const first = new Date(y, m, 1); const start = new Date(y, m, 1 - first.getDay());
  const t = todayStr(); let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m) break;
    const ds = ymd(d);
    const recs = S.records.filter(r => r.date === ds);
    const evs = S.events.filter(e => e.date === ds);
    const prs = S.praises.filter(p => p.date === ds && visiblePraise(p));
    const authors = [...new Set(recs.map(r => r.author))];
    cells += `<button class="day ${d.getMonth() !== m ? 'out' : ''} ${ds === t ? 'today' : ''} ${ds === S.sel ? 'sel' : ''}" data-act="sel" data-date="${ds}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일">
      <span class="n">${d.getDate()}</span>
      ${evs.slice(0, 2).map(e => `<span class="ev ${side(e.owner)}"></span>`).join('')}
      <span class="marks">${authors.map(a => `<i class="mk ${side(a)}"></i>`).join('')}${recs.some(r => r.photoId) ? '<i class="mk photo"></i>' : ''}${prs.length ? '<i class="mk heart">♥</i>' : ''}</span>
    </button>`;
  }
  return `<div class="stack">
    <div><div class="calhead"><button class="iconbtn" data-act="mon" data-d="-1" aria-label="이전 달">‹</button><h2>${y}년 ${m + 1}월</h2><button class="iconbtn" data-act="mon" data-d="1" aria-label="다음 달">›</button></div>
    <div class="cal">${WD.map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>
    <div class="row muted" style="margin-top:8px;gap:12px;font-size:12px">${members().map(id => `<span class="row" style="gap:4px"><i class="mk ${side(id)}"></i>${esc(nick(id))}</span>`).join('')}<span class="row" style="gap:4px"><i class="mk photo"></i>사진</span><span class="row" style="gap:4px"><i class="mk heart">♥</i>칭찬</span></div></div>
    ${dayPanel(S.sel)}

}

          <div class="stamps">${Array.from({ length: 10 }, (_, i) => `<div class="stamp ${i < n ? 'on' : ''}">${i < n ? '맛집' : i + 1}</div>`).join('')}</div></div>`

          <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="none" stroke="#F2B544" stroke-width="3"/><path d="M20 20 L20 5 A15 15 0 0 1 33 13 Z" fill="#DD4F75"/><path d="M20 20 L33 13 A15 15 0 0 1 31 30 Z" fill="#A6E1D8"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg></button>`}
    <div class="chips" role="group">${['전체', ...CATS].map(c => `<button class="chip" data-act="cat" data-v="${c}" aria-pressed="${S.cat === c}">${c}</button>`).join('')}</div>
    ${list.length ? list.map(card).join('') : `<div class="card empty">${S.tastyTab === 'visited' ? '함께 다녀온 맛집을 기록해 보세요.' : '먹고 싶은 곳을 담아 두세요.'}</div>`}
    ${w ? `<div class="fab"><button class="btn" data-act="add-place">+ ${S.tastyTab === 'visited' ? '맛집 기록' : '먹킷리스트 담기'}</button></div>` : ''}
  </div>`;
}

/* ---------- sheets ---------- */
function recordSheet(date) {
  openSheet(`<h3>기록 남기기</h3>
    <label class="field"><span>날짜</span><input type="date" id="r-date" value="${date || todayStr()}"></label>
    <label class="field"><span>한 줄</span><textarea id="r-text" maxlength="${MAX_TEXT}" placeholder="오늘 있었던 일을 한 줄로 남겨요"></textarea></label>
    <label class="field"><span>사진</span><input type="file" id="r-photo" accept="image/*"><img class="preview" id="r-prev" hidden alt=""></label>
    <div class="acts"><button class="btn ghost" id="x">취소</button><button class="btn" id="ok">저장</button></div>`, sh => {
    let photo = null;
    $('#x', sh).onclick = closeSheet;
    $('#r-photo', sh).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { photo = await compressImage(f); const p = $('#r-prev', sh); p.src = photo; p.hidden = false; } catch (er) { toast(er.message); }
    };

      const text = $('#r-text', sh).value.trim(), d = $('#r-date', sh).value || todayStr();

      try {
        let photoId = null;

        await save(() => B.add('records', { date: d, text, photoId, author: S.me, createdAt: Date.now() }), '섬에 기록이 쌓였어요');
        closeSheet(); S.sel = d;
      } catch (e) { ok.disabled = false; ok.textContent = '저장'; }
    };
  });
}
function eventSheet(date) {
  const pid = partnerId();
  openSheet(`<h3>일정 추가</h3>
    <label class="field"><span>날짜</span><input type="date" id="e-date" value="${date || todayStr()}"></label>
    <label class="field"><span>일정</span><input id="e-title" maxlength="30" placeholder="예: 시험 보는 날"></label>
    <div class="field"><span>누구의 일정인가요</span><div class="opts" id="e-who"><button type="button" class="opt" data-v="${S.me}" aria-pressed="true">${esc(nick(S.me))}</button>${pid ? `<button type="button" class="opt" data-v="${pid}" aria-pressed="false">${esc(nick(pid))}</button>` : ''}</div></div>

function praiseSheet(date, eventId) {
  const pid = partnerId(); if (!pid) return;

    <label class="field"><span>${esc(nick(pid))}님에게</span><textarea id="p-text" maxlength="${MAX_TEXT}" placeholder="${ev ? '고생했어! 끝나고 맛있는 거 먹자' : '오늘도 고마워'}"></textarea></label>
    ${ev ? '' : `<label class="field"><span>붙일 날짜</span><input type="date" id="p-date" value="${date || todayStr()}"></label>`}
    <div class="field"><span>언제 열어볼 수 있나요</span><div class="opts" id="p-when"><button type="button" class="opt" data-v="now" aria-pressed="true">바로 보내기</button><button type="button" class="opt" data-v="night" aria-pressed="false">오늘 밤 10시</button></div></div>

function placeSheet(p, mode) {
  const status = p ? p.status : (mode || S.tastyTab);
  const visited = status === 'visited';
  openSheet(`<h3>${p ? '맛집 수정' : visited ? '맛집 기록' : '먹킷리스트 담기'}</h3>
    <label class="field"><span>가게 이름 또는 음식</span><input id="pl-name" maxlength="30" value="${esc(p?.name || '')}" placeholder="${visited ? '예: 연남동 파스타집' : '예: 성수 마라탕'}"></label>

    ${visited ? `<div class="field"><span>우리의 별점</span>${starInput('pl-star', p?.rating || 0)}</div>
      <label class="field"><span>한 줄 평</span><input id="pl-review" maxlength="60" value="${esc(p?.review || '')}" placeholder="예: 파스타 최고, 분위기 좋음"></label>
      <label class="field"><span>방문한 날</span><input type="date" id="pl-date" value="${p?.visitedAt || todayStr()}"></label>`
      : `<label class="field"><span>메모</span><input id="pl-memo" maxlength="60" value="${esc(p?.memo || '')}" placeholder="예: 웨이팅 있으니 평일에"></label>`}
    <div class="acts"><button class="btn ghost" id="x">취소</button><button class="btn" id="ok">저장</button></div>`, sh => {
    wireOpts(sh); wireStars(sh); $('#x', sh).onclick = closeSheet;
    $('#ok', sh).onclick = async () => {
      const name = $('#pl-name', sh).value.trim(); if (!name) return toast('이름을 입력해 주세요.');
      const data = { name, cat: optVal(sh, 'pl-cat') || '기타' };
      if (visited) { data.rating = +$('#pl-star', sh).dataset.v || 0; data.review = $('#pl-review', sh).value.trim(); data.visitedAt = $('#pl-date', sh).value || todayStr(); }
      else data.memo = $('#pl-memo', sh).value.trim();
      $('#ok', sh).disabled = true;
      try {
        if (p) await save(() => B.update('places', p.id, data), '수정했어요');
        else await save(() => B.add('places', { ...data, status, author: S.me, createdAt: Date.now() }), visited ? '맛집 도감에 기록했어요' : '먹킷리스트에 담았어요');
        closeSheet();
      } catch (e) { $('#ok', sh).disabled = false; }
    };
  });
}
function visitSheet(p) {
  openSheet(`<h3>${esc(p.name)} 다녀왔어요</h3>
    <div class="field"><span>우리의 별점</span>${starInput('v-star', 0)}</div>
    <label class="field"><span>한 줄 평</span><input id="v-review" maxlength="60" placeholder="어땠는지 한 줄로 남겨요"></label>
    <label class="field"><span>방문한 날</span><input type="date" id="v-date" value="${todayStr()}"></label>
    <div class="acts"><button class="btn ghost" id="x">취소</button><button class="btn alt" id="ok">도감에 기록</button></div>`, sh => {
    wireStars(sh); $('#x', sh).onclick = closeSheet;
    $('#ok', sh).onclick = async () => {
      $('#ok', sh).disabled = true;
      try {
        await save(() => B.update('places', p.id, { status: 'visited', rating: +$('#v-star', sh).dataset.v || 0, review: $('#v-review', sh).value.trim(), visitedAt: $('#v-date', sh).value || todayStr() }), '맛집 도감으로 옮겼어요');
        closeSheet(); S.tastyTab = 'visited'; render();
      } catch (e) { $('#ok', sh).disabled = false; }
    };
  });
}
function rouletteSheet() {
  const pool = S.places.filter(p => p.status === 'wish' && (S.cat === '전체' || p.cat === S.cat));
  if (!pool.length) return toast(S.cat === '전체' ? '먹킷리스트를 먼저 담아 주세요.' : `${S.cat} 먹킷리스트가 비어 있어요.`);
  openSheet(`<h3>오늘 뭐 먹지?</h3><div class="wheel" id="wh"><b id="wn">${esc(pool[0].name)}</b></div><p class="muted" id="wm" style="text-align:center;min-height:22px"></p>
    <div class="acts"><button class="btn ghost" id="again">다시 돌리기</button><button class="btn alt" id="x">결정!</button></div>`, sh => {
    $('#x', sh).onclick = closeSheet;
    const spin = () => {
      const pick = Math.floor(Math.random() * pool.length); const wh = $('#wh', sh), wn = $('#wn', sh), wm = $('#wm', sh);
      wh.classList.remove('done'); wm.textContent = '';
      const finish = () => { const p = pool[pick]; wn.textContent = p.name; wh.classList.add('done'); wm.textContent = `${p.cat}${p.memo ? ' · ' + p.memo : ''}`; };
      if (reduceMotion || pool.length === 1) return finish();
      let i = 0, delay = 50; const steps = 18 + Math.floor(Math.random() * pool.length);
      const tick = () => { if (!document.body.contains(wn)) return; if (i >= steps) return finish(); wn.textContent = pool[i % pool.length].name; i++; delay *= 1.12; setTimeout(tick, delay); };
      tick();
    };
    $('#again', sh).onclick = spin; spin();
  });
}
function settingsSheet() {
  const c = S.couple; const solo = members().length < 2;
  openSheet(`<h3>섬 설정</h3>
    ${solo ? `<div class="card" style="margin-bottom:14px;background:#FFF5E1;border-color:#F2D48A"><div class="muted">연인에게 보낼 초대 코드</div>
      <div class="row" style="justify-content:space-between;margin-top:4px"><b style="font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:4px" id="s-code">${esc(c.inviteCode || '')}</b>
      ${c.inviteCode ? '<button class="btn small" id="s-copy">복사</button>' : '<button class="btn small" id="s-newcode">코드 만들기</button>'}</div></div>` : ''}
    <label class="field"><span>섬 이름</span><input id="s-name" maxlength="16" value="${esc(c.name || '')}"></label>
    <label class="field"><span>내 닉네임</span><input id="s-nick" maxlength="12" value="${esc(c.nick?.[S.me] || '')}"></label>
    <label class="field"><span>처음 만난 날</span><input type="date" id="s-since" value="${esc(c.since || '')}"></label>
    <div class="acts"><button class="btn ghost" id="x">취소</button><button class="btn" id="ok">저장</button></div>
    <div class="row" style="justify-content:space-between;margin-top:16px"><span class="muted">${esc(S.email || '')}</span><button class="link" data-act="logout">로그아웃</button></div>`, sh => {
    $('#x', sh).onclick = closeSheet;
    const cp = $('#s-copy', sh); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(c.inviteCode); toast('초대 코드를 복사했어요'); } catch (e) { toast('코드를 길게 눌러 복사해 주세요.'); } };
    const nc = $('#s-newcode', sh); if (nc) nc.onclick = async () => { nc.disabled = true; try { const code = await makeInvite(S.iid); $('#s-code', sh).textContent = code; nc.remove(); } catch (e) { toast(errMsg(e)); nc.disabled = false; } };
    $('#ok', sh).onclick = async () => {
      const patch = { name: $('#s-name', sh).value.trim() || c.name, since: $('#s-since', sh).value || c.since };
      const n = $('#s-nick', sh).value.trim(); if (n) patch.nick = { [S.me]: n };
      $('#ok', sh).disabled = true;
      try { await save(() => B.update('couple', 'main', patch), '저장했어요'); closeSheet(); } catch (e) { $('#ok', sh).disabled = false; }
    };
  });
}
function confirmDelete(col, id) {
  openSheet(`<h3>삭제할까요?</h3><p class="muted">삭제한 기록은 되돌릴 수 없어요.</p>
    <div class="acts"><button class="btn ghost" id="x">취소</button><button class="btn" style="background:#B23A48" id="ok">삭제</button></div>`, sh => {
    $('#x', sh).onclick = closeSheet;
    $('#ok', sh).onclick = async () => {
      $('#ok', sh).disabled = true;
      try {
        if (col === 'records') { const r = S.records.find(x => x.id === id); if (r?.photoId) await save(() => B.remove('photos', r.photoId)); }
        await save(() => B.remove(col, id), '삭제했어요'); closeSheet();
      } catch (e) { $('#ok', sh).disabled = false; }
    };
  });
}
async function openGift(btn, id) {
  const p = S.praises.find(x => x.id === id); if (!p) return;
  btn.classList.add('opening');
  await new Promise(r => setTimeout(r, reduceMotion ? 0 : 550));
  openSheet(`<h3>${esc(nick(p.from))}님의 칭찬 카드</h3><div class="note pink" style="--r:-1.5deg;font-size:24px;padding:18px">${esc(p.text)}<div class="meta">${dotDate(p.date)}${p.eventId ? ' · ' + esc(S.events.find(e => e.id === p.eventId)?.title || '') : ''}</div></div>
    <div class="acts" style="margin-top:16px"><button class="btn alt" id="x">고마워!</button></div>`, sh => { $('#x', sh).onclick = closeSheet; });
  try { await B.update('praises', id, { openedAt: Date.now() }); } catch (e) {}
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a === 'record') recordSheet(el.dataset.date);
  else if (a === 'event') eventSheet(el.dataset.date);
  else if (a === 'praise') praiseSheet(el.dataset.date, el.dataset.event);
  else if (a === 'open-gift') openGift(el, el.dataset.id);
  else if (a === 'sel') { S.sel = el.dataset.date; const d = parseYmd(S.sel); if (d.getMonth() !== S.cal.m) S.cal = { y: d.getFullYear(), m: d.getMonth() }; render(); }
  else if (a === 'mon') { let { y, m } = S.cal; m += +el.dataset.d; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.cal = { y, m }; render(); }
  else if (a === 'ttab') { S.tastyTab = el.dataset.v; render(); }
  else if (a === 'cat') { S.cat = el.dataset.v; render(); }
  else if (a === 'roulette') rouletteSheet();
  else if (a === 'add-place') placeSheet(null);
  else if (a === 'edit-place') placeSheet(S.places.find(p => p.id === el.dataset.id));
  else if (a === 'visit') visitSheet(S.places.find(p => p.id === el.dataset.id));
  else if (a === 'del') confirmDelete(el.dataset.col, el.dataset.id);
  else if (a === 'auth-mode') { S.authMode = S.authMode === 'join' ? 'login' : 'join'; render(); }
  else if (a === 'auth-reset') resetPassword();
  else if (a === 'setup-mode') { S.setupMode = el.dataset.v; render(); }
  else if (a === 'logout') { closeSheet(); F.signOut(auth); }
  else if (a === 'reload') location.reload();
});
$('#settingsBtn').addEventListener('click', settingsSheet);
const TABS = ['island', 'calendar', 'tasty'];
function route() { const h = location.hash.slice(1); S.tab = TABS.includes(h) ? h : 'island'; $('#main').scrollTop = 0; render(); }
window.addEventListener('hashchange', route);
let lastGiftKey = '';
setInterval(() => { const k = gifts().map(g => g.id).join(); if (k !== lastGiftKey) { lastGiftKey = k; if (!$('#layer').innerHTML) render(); } }, 30000);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => S.tab === 'island' && startIsland(), 150); });

/* ---------- boot ---------- */
const FB_CONFIG = {
  apiKey: "AIzaSyBjiILaw2P1DO2XVr03k-O8EATHvT4WLVA",
  authDomain: "gyurongisland.firebaseapp.com",
  projectId: "gyurongisland",
  storageBucket: "gyurongisland.firebasestorage.app",
  messagingSenderId: "1063237506934",
  appId: "1:1063237506934:web:b0d40ce1b305c4403c0c57"
};
const FB_URL = 'https://www.gstatic.com/firebasejs/10.12.2/';
let F = null, auth = null, db = null, unsubs = [], loadTimer = 0;
function resetData() {
  unsubs.forEach(f => { try { f(); } catch (e) {} }); unsubs = [];
  clearTimeout(loadTimer);
  Object.assign(S, { couple: null, coupleLoaded: false, records: [], praises: [], events: [], places: [], photos: {}, iid: null, offline: false, ready: false });
  B = null;
}
function enterIsland(iid) {
  resetData();
  S.iid = iid; B = fbBackend(F, db, iid); S.phase = 'app'; render();
  loadTimer = setTimeout(() => { if (!S.ready) { S.offline = true; render(); } }, 10000);
  const onErr = e => { if (e?.code === 'permission-denied') { S.couple = null; S.coupleLoaded = true; } else S.offline = true; render(); };
  unsubs.push(B.listenDoc('couple', 'main', (c, meta) => {
    S.couple = c; S.coupleLoaded = true;
    if (!meta.fromCache) { S.ready = true; S.offline = false; clearTimeout(loadTimer); }
    render();
  }, onErr));
  ['records', 'praises', 'events', 'places'].forEach(col => unsubs.push(B.listen(col, docs => { S[col] = docs; render(); }, onErr)));
}
async function boot() {
  S.phase = 'loading'; S.authMode = 'login'; S.setupMode = 'create';
  route();
  try {
    const [appM, authM, fsM] = await Promise.all([import(FB_URL + 'firebase-app.js'), import(FB_URL + 'firebase-auth.js'), import(FB_URL + 'firebase-firestore.js')]);
    F = { ...authM, ...fsM };
    const app = appM.initializeApp(FB_CONFIG);
    auth = authM.getAuth(app); db = fsM.getFirestore(app);
  } catch (e) { S.phase = 'error'; render(); return; }
  F.onAuthStateChanged(auth, async u => {
    resetData();
    if (!u) { S.me = null; S.email = ''; S.phase = 'auth'; render(); return; }
    S.me = u.uid; S.email = u.email || ''; S.phase = 'loading'; render();
    try {
      const us = await F.getDoc(F.doc(db, 'users', u.uid));
      const iid = us.exists() ? us.data().islandId : null;
      if (iid) enterIsland(iid); else { S.phase = 'setup'; render(); }
    } catch (e) { S.phase = 'error'; render(); }
  });
}
boot();
})();
